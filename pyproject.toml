[project]
name = "wolke"
version = "2.0.0"
description = "Web-Oriented Layout for Knowledge Exploration – visualisiert Metadaten-DBs und liefert NumPy an BLITZ."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dash",
    "dash-bootstrap-components",
    "dash-mantine-components==0.12.1",
    "eventlet",
    "flask",
    "flask-socketio",
    "gunicorn",
    "numpy",
    "pandas",
    "pillow",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
]
